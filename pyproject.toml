[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marina-static-analysis-coursework"
version = "0.1.0"
description = "Учебный пример методов статического анализа Python"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["staticcheck*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
